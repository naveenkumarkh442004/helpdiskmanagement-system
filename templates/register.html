<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account - HelpDesk Portal</title>
    <meta name="description" content="Register for a new HelpDesk customer account to submit and track support tickets.">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <!-- Header Navigation -->
    <header class="navbar">
        <div class="app-container navbar-inner">
            <a href="/" class="brand" id="reg-nav-logo">
                <div class="brand-icon">
                    <i class="fa-solid fa-headset"></i>
                </div>
                <span class="brand-text">Help<span>Desk</span></span>
            </a>
            <div class="nav-actions">
                <a href="/" class="btn btn-ghost btn-sm" id="btn-reg-home">
                    <i class="fa-solid fa-house"></i> Home
                </a>
                <a href="/login" class="btn btn-secondary btn-sm" id="btn-reg-login">
                    <i class="fa-solid fa-lock"></i> Sign In
                </a>
            </div>
        </div>
    </header>

    <!-- Main Register Area -->
    <main class="app-main">
        <div class="auth-wrapper" style="max-width: 520px;">
            <div class="auth-card">
                
                <div class="auth-header">
                    <div class="auth-logo">
                        <i class="fa-solid fa-user-plus"></i>
                    </div>
                    <h1 class="auth-title">Create User Account</h1>
                    <p class="auth-subtitle">Join HelpDesk to submit and track support tickets</p>
                </div>

                {% if error %}
                    <div class="alert alert-danger" id="register-error-alert">
                        <i class="fa-solid fa-circle-exclamation alert-icon"></i>
                        <div>{{ error }}</div>
                    </div>
                {% endif %}

                <form method="POST" action="/register" id="register-form">
                    
                    <div class="form-group input-with-icon">
                        <label class="form-label" for="reg-name">Full Name <span class="required">*</span></label>
                        <div class="input-wrapper">
                            <i class="fa-solid fa-id-card input-icon"></i>
                            <input 
                                type="text" 
                                class="form-control" 
                                id="reg-name" 
                                name="name" 
                                placeholder="e.g. Jane Doe" 
                                required 
                                autofocus
                            >
                        </div>
                    </div>

                    <div class="form-group input-with-icon">
                        <label class="form-label" for="reg-email">Email Address <span class="required">*</span></label>
                        <div class="input-wrapper">
                            <i class="fa-solid fa-envelope input-icon"></i>
                            <input 
                                type="email" 
                                class="form-control" 
                                id="reg-email" 
                                name="email" 
                                placeholder="name@company.com" 
                                required
                            >
                        </div>
                    </div>

                    <div class="form-group input-with-icon">
                        <label class="form-label" for="reg-username">Username <span class="required">*</span></label>
                        <div class="input-wrapper">
                            <i class="fa-solid fa-user input-icon"></i>
                            <input 
                                type="text" 
                                class="form-control" 
                                id="reg-username" 
                                name="username" 
                                placeholder="Choose a unique username" 
                                required
                            >
                        </div>
                    </div>

                    <div class="form-group input-with-icon">
                        <label class="form-label" for="reg-password">Password <span class="required">*</span></label>
                        <div class="input-wrapper">
                            <i class="fa-solid fa-lock input-icon"></i>
                            <input 
                                type="password" 
                                class="form-control" 
                                id="reg-password" 
                                name="password" 
                                placeholder="Create a secure password (min. 4 chars)" 
                                minlength="4"
                                required
                            >
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary btn-block btn-lg" id="btn-register-submit" style="margin-top: 1.25rem;">
                        <i class="fa-solid fa-circle-check"></i> Register Account
                    </button>

                </form>

                <div class="auth-footer">
                    <p>Already have an account? <a href="/login" id="link-to-login">Sign In here</a></p>
                </div>

            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="app-footer">
        <div class="app-container footer-inner">
            <div>© 2026 HelpDesk Management System</div>
            <div class="system-status-indicator">
                <span class="status-dot-pulse"></span>
                <span>System Operational</span>
            </div>
        </div>
    </footer>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ error_code }} - {{ error_title }} | HelpDesk</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body style="min-height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; background: var(--bg-page); padding: 1.5rem;">

    <div style="max-width: 500px; width: 100%; background: #ffffff; border-radius: var(--radius-xl); border: 1px solid var(--border-subtle); padding: 2.5rem 2rem; box-shadow: var(--shadow-lg); text-align: center;">
        
        <div style="width: 72px; height: 72px; border-radius: 50%; background: {{ '#fee2e2' if error_code in [500, 403] else '#eff6ff' }}; color: {{ '#dc2626' if error_code in [500, 403] else '#4f46e5' }}; display: flex; align-items: center; justify-content: center; font-size: 2rem; margin: 0 auto 1.5rem auto;">
            {% if error_code == 404 %}
                <i class="fa-solid fa-compass"></i>
            {% elif error_code == 403 %}
                <i class="fa-solid fa-shield-halved"></i>
            {% elif error_code == 413 %}
                <i class="fa-solid fa-file-circle-exclamation"></i>
            {% else %}
                <i class="fa-solid fa-triangle-exclamation"></i>
            {% endif %}
        </div>

        <div style="font-size: 3rem; font-weight: 900; line-height: 1; color: var(--text-primary); margin-bottom: 0.5rem; letter-spacing: -0.03em;">
            {{ error_code }}
        </div>

        <h2 style="font-size: 1.35rem; font-weight: 700; color: var(--text-primary); margin: 0 0 0.75rem 0;">
            {{ error_title }}
        </h2>

        <p style="color: var(--text-secondary); font-size: 0.95rem; line-height: 1.5; margin: 0 0 2rem 0;">
            {{ error_description }}
        </p>

        <div style="display: flex; gap: 0.75rem; justify-content: center; flex-wrap: wrap;">
            <a href="javascript:history.back()" class="btn btn-secondary">
                <i class="fa-solid fa-arrow-left"></i> Go Back
            </a>
            <a href="/dashboard" class="btn btn-primary">
                <i class="fa-solid fa-house"></i> Return to Dashboard
            </a>
        </div>
    </div>

    <div style="margin-top: 1.5rem; color: var(--text-muted); font-size: 0.8rem;">
        HelpDesk Support Management System &bull; Operations Console
    </div>

</body>
</html>
